name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (real errors only: syntax, undefined names, bad comparisons)
        run: ruff check --select E9,F63,F7,F82 backend frontend tests experiments

      - name: Tests
        run: pytest -q
